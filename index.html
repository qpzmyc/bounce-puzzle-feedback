<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bounce Puzzle feedback</title>
<meta name="description" content="Help pick what Bounce Puzzle's videos look like next.">
<meta name="theme-color" content="#0f0f1a">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ground" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="dots"></i></div>
<header class="top">
  <div class="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i><b></b></div>
  <button type="button" class="back" id="back" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</header>

<main>
  <form id="form" novalidate>
    <section class="screen welcome" data-screen="welcome" aria-labelledby="t-welcome">
      <!-- The ball drops onto the ramp and bounces into the goal, on a loop -->
      <svg class="scene" id="scene" viewBox="0 0 280 170" aria-hidden="true">
        <path d="M44 10 L44 66 Q118 4 214 128" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"/>
        <rect x="20" y="78" width="60" height="11" rx="5.5" fill="#4ecdc4" transform="rotate(-16 50 83)"/>
        <rect x="190" y="132" width="48" height="30" rx="8" fill="#95e77e"/>
        <circle r="11" fill="#ff6b6b">
          <animateMotion dur="2.4s" repeatCount="indefinite" path="M44 10 L44 66 Q118 4 214 128 L214 136" keyPoints="0;0.22;0.92;1;1" keyTimes="0;0.25;0.7;0.78;1" calcMode="spline" keySplines="0.5 0 1 1;0 0.4 0.6 1;0.5 0 1 1;0 0 1 1"/>
        </circle>
      </svg>
      <h1 id="t-welcome" tabindex="-1" class="wordmark" aria-label="Bounce Puzzle">
        <img src="assets/bounce.png" alt="" width="716" height="123"><img src="assets/puzzle.png" alt="" width="642" height="120">
      </h1>
      <div class="note">
        <p>Thanks for helping me improve Bounce Puzzle</p>
        <p>About 10 minutes. Every question is optional, so skip anything you like</p>
      </div>
      <div class="actions center">
        <button type="button" class="btn primary big" data-next>Start</button>
      </div>
    </section>
    <!-- Every other screen is built by app.js from its SCREENS list -->
    <div id="screens"></div>
  </form>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Replay">
    <button type="button" class="sheet-close" id="sheet-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
    <div id="sheet-player"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
